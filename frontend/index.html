<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#050807">

  <title>SYSTeM</title>

  <!-- Telegram Mini App API -->
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <!-- SYSTeM styles -->
  <link rel="stylesheet" href="./css/system.css">
</head>

<body>

  <!-- LANGUAGE -->
  <div class="language-switcher">
    <button type="button" data-language="ru">RU</button>
    <button type="button" data-language="de">DE</button>
    <button type="button" data-language="en">EN</button>
  </div>

  <div id="app">

    <main class="system">

      <!-- HEADER -->
      <header class="system-header">

        <div class="system-name">
          SYSTeM
        </div>

        <div class="system-meta">

          <span
            class="online"
            data-i18n="system.online"
          >
            СИСТЕМА В СЕТИ
          </span>

          <span class="status-dot"></span>

        </div>

      </header>


      <!-- STATUS -->
      <section class="panel status-panel">

        <div
          class="terminal-line"
          data-i18n="system.status"
        >
          СИСТЕМА ЗАПУЩЕНА
        </div>

        <div class="terminal-line">
          <span data-i18n="system.state">
            СОСТОЯНИЕ
          </span>

          <span data-i18n="system.ready">
            ГОТОВО
          </span>
        </div>

        <div class="terminal-line">
          <span data-i18n="system.purpose">
            НАЗНАЧЕНИЕ
          </span>

          <span data-i18n="system.unknown">
            НЕИЗВЕСТНО
          </span>
        </div>

        <div class="terminal-line">
          <span data-i18n="system.connection">
            СОЕДИНЕНИЕ
          </span>

          <span data-i18n="system.local">
            ЛОКАЛЬНОЕ
          </span>
        </div>

        <div class="terminal-line">
          <span data-i18n="system.primary">
            ОСНОВНОЙ ПРОЦЕСС
          </span>
        </div>

        <div class="terminal-line">
          <span data-i18n="system.resource">
            ДОСТУПНЫЙ РЕСУРС
          </span>
        </div>

      </section>


      <!-- PROCESS -->
      <section class="panel process-panel">

        <div
          id="resource-value"
          class="resource-value"
        >
          000000
        </div>

        <button
          id="process-button"
          class="process-button"
          type="button"
          data-i18n="process.button"
        >
          [ ЗАПУСК ]
        </button>

      </section>


      <!-- SYSTEM LOG -->
      <section class="panel log-panel">

        <div class="system-log-title">
          SYSTEM LOG
        </div>

        <div
          id="system-log"
          class="system-log"
        ></div>

      </section>


      <!-- FOOTER -->
      <footer class="system-footer">
        SYSTeM // PROTOTYPE
      </footer>

    </main>

  </div>


  <!-- SYSTeM CORE -->
  <script src="./js/locales.js"></script>
  <script src="./js/telegram.js"></script>
  <script src="./js/system.js"></script>

</body>
</html>

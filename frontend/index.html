<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050705"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>SYSTeM</title>


    <!-- Telegram Mini App SDK -->

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>


    <!-- SYSTeM CSS -->

    <link
        rel="stylesheet"
        href="./css/system.css"
    >

</head>


<body>


    <!-- =====================================================
         LANGUAGE
         ===================================================== -->

    <div
        id="language-switcher"
        class="language-switcher"
    >

        <button
            type="button"
            class="language-button"
            data-language="ru"
            aria-pressed="true"
        >
            RU
        </button>

        <button
            type="button"
            class="language-button"
            data-language="de"
            aria-pressed="false"
        >
            DE
        </button>

        <button
            type="button"
            class="language-button"
            data-language="en"
            aria-pressed="false"
        >
            EN
        </button>

    </div>


    <!-- =====================================================
         APP
         ===================================================== -->

    <div id="app">

        <main class="system">


            <!-- =================================================
                 HEADER
                 ================================================= -->

            <header class="system-header">

                <div>

                    <div
                        class="system-name"
                        data-i18n="system.name"
                    >
                        SYSTeM
                    </div>

                    <div
                        class="system-meta"
                        data-i18n="system.version"
                    >
                        CORE // v0.1.3
                    </div>

                </div>


                <div class="system-meta">

                    <div class="online">

                        <span class="status-dot"></span>

                        <span
                            data-i18n="system.online"
                        >
                            ONLINE
                        </span>

                    </div>

                    <div
                        data-i18n="system.user"
                    >
                        USER: UNKNOWN
                    </div>

                </div>

            </header>


            <!-- =================================================
                 STATUS
                 ================================================= -->

            <section class="panel status-panel">

                <div
                    class="panel-title"
                    data-i18n="status.title"
                >
                    SYSTEM STATUS
                </div>


                <div class="status-row">

                    <span
                        class="status-label"
                        data-i18n="status.state"
                    >
                        STATE
                    </span>

                    <span
                        class="status-value"
                        data-i18n="status.ready"
                    >
                        READY
                    </span>

                </div>


                <div class="status-row">

                    <span
                        class="status-label"
                        data-i18n="status.purpose"
                    >
                        PURPOSE
                    </span>

                    <span
                        class="status-value"
                        data-i18n="status.unknown"
                    >
                        UNKNOWN
                    </span>

                </div>


                <div class="status-row">

                    <span
                        class="status-label"
                        data-i18n="status.connection"
                    >
                        CONNECTION
                    </span>

                    <span
                        class="status-value"
                        data-i18n="status.local"
                    >
                        LOCAL
                    </span>

                </div>

            </section>


            <!-- =================================================
                 PROCESS
                 ================================================= -->

            <section class="panel process-panel">

                <div
                    class="panel-title"
                    data-i18n="process.title"
                >
                    PRIMARY PROCESS
                </div>


                <div class="process-content">

                    <div
                        class="resource-label"
                        data-i18n="resource.available"
                    >
                        AVAILABLE RESOURCE
                    </div>


                    <div
                        id="resource-value"
                        class="resource-value"
                    >
                        000000
                    </div>


                    <button
                        id="process-button"
                        class="process-button"
                        type="button"
                        data-i18n="process.button"
                    >
                        [ PROCESS ]
                    </button>

                </div>

            </section>


            <!-- =================================================
                 LOG
                 ================================================= -->

            <section class="panel log-panel">

                <div
                    class="panel-title"
                    data-i18n="log.title"
                >
                    SYSTEM LOG
                </div>


                <div
                    id="system-log"
                    class="system-log"
                    aria-live="polite"
                ></div>

            </section>


            <!-- =================================================
                 FOOTER
                 ================================================= -->

            <footer class="system-footer">

                <span
                    data-i18n="footer.system"
                >
                    SYSTeM
                </span>

                <span>
                    //
                </span>

                <span
                    data-i18n="footer.prototype"
                >
                    PROTOTYPE
                </span>

            </footer>


        </main>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="./js/locales.js"></script>

    <script src="./js/telegram.js"></script>

    <script src="./js/system.js"></script>


</body>

</html>
